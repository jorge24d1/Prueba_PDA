<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Completar Registro | Concesionario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: none;
            max-width: 500px;
            width: 100%;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4 mx-auto">
        <div class="text-center mb-4">
            <h3>¡Casi terminamos!</h3>
            <p class="text-muted">Hola <span th:text="${usuario.nombreUser}">Usuario</span>, necesitamos tu número de identificación para completar el registro.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/usuario/completar-registro}" method="post">
            <div class="mb-3">
                <label for="identificacion" class="form-label">Número de Identificación</label>
                <input type="text" class="form-control" id="identificacion" name="identificacion" required
                       placeholder="Ingresa tu cédula" pattern="[0-9]+" title="Solo números">
                <div class="form-text">Usaremos esto para agendar tus citas y gestionar tus compras.</div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Guardar y Continuar</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
