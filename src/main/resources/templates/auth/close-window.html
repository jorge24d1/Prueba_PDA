<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redireccionando - NextGenMotors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center">
  <div class="text-green-500 text-6xl mb-4">
    <i class="fas fa-check-circle"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-800 mb-4">¡Éxito!</h2>

  <p class="text-gray-600 mb-6" th:text="${message ?: 'Operación completada exitosamente'}"></p>

  <div class="flex justify-center space-x-4">
    <button onclick="closeAndRedirect()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
      Cerrar Ventana
    </button>
  </div>

  <p class="text-sm text-gray-500 mt-4">
    Esta ventana se cerrará automáticamente en <span id="countdown">5</span> segundos
  </p>
</div>

<script>
  let seconds = 5;
  const countdownElement = document.getElementById('countdown');

  function updateCountdown() {
      countdownElement.textContent = seconds;
      if (seconds <= 0) {
          closeAndRedirect();
      } else {
          seconds--;
          setTimeout(updateCountdown, 1000);
      }
  }

  function closeAndRedirect() {
      // Intentar cerrar esta ventana
      if (window.opener && !window.opener.closed) {
          // Notificar a todas las ventanas de recuperación que se cierren
          window.opener.postMessage('CLOSE_ALL_PASSWORD_WINDOWS', '*');
      }

      // Cerrar esta ventana
      window.close();

      // Si no se puede cerrar, redirigir
      setTimeout(() => {
          const redirectUrl = /*[[${redirectUrl}]]*/ '/login';
          window.location.href = redirectUrl;
      }, 100);
  }

  // Iniciar cuenta regresiva
  updateCountdown();

  // Cerrar inmediatamente si se hace clic en cualquier parte
  document.addEventListener('click', closeAndRedirect);
</script>
</body>
</html>
