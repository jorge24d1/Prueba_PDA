spring.application.name=concesionario

# =============================================
# CONFIGURACION MONGODB
# =============================================
spring.data.mongodb.uri=${MONGODB_URI}

# =============================================
# CONFIGURACION CLOUDINARY
# =============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.upload-folder=auto_plus/vehiculos

# =============================================
# CONFIGURACION THYMELEAF
# =============================================
spring.thymeleaf.extras.springsecurity5.enabled=true

# =============================================
# CONFIGURACION SUBIDA DE ARCHIVOS
# =============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =============================================
# CONFIGURACION DESARROLLO
# =============================================
spring.devtools.restart.enabled=true
spring.resources.cache.cachecontrol.max-age=0
spring.resources.cache.cachecontrol.no-cache=true
spring.resources.cache.cachecontrol.no-store=true
spring.resources.cache.cachecontrol.must-revalidate=true

# =============================================
# CONFIGURACION BASE URL
# =============================================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =============================================
# CONFIGURACION CORREO
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================
# CONFIGURACION ERRORES
# =============================================
server.error.whitelabel.enabled=false
server.error.include-exception=true
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================
# CONFIGURACION THYMELEAF
# =============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# =============================================
# CONFIGURACION LOGGING
# =============================================
logging.level.com.concesionario=DEBUG
logging.level.org.springframework.web=DEBUG

# =============================================
# CONFIGURACION API KEY
# =============================================
gemini.api.key=${GEMINI_API_KEY}

# =============================================
# CONFIGURACION WEBCLIENT
# =============================================
spring.webflux.client.timeout=30s

# =============================================
# CONFIGURACION SESIONES (CORREGIDO)
# =============================================
server.servlet.session.timeout=1800
server.servlet.session.cookie.http-only=true
# Solo si usas HTTPS - en desarrollo comenta esta línea
# server.servlet.session.cookie.secure=true

  
# Azure Notification Hubs  
azure.notification-hub.connection-string=${AZURE_NH_CONNECTION_STRING}
azure.notification-hub.hub-name=${AZURE_NH_HUB_NAME} 
azure.notification-hub.hub-name=${AZURE_NH_HUB_NAME} 

# =============================================
# CONFIGURACION OAUTH2 (SOCIAL LOGIN)
# =============================================
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.user-name-attribute=email

